services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev-only}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:-localdev-only}
      LAB_MODE: "true"
    depends_on: [db]
  frontend:
    build: ./frontend
    depends_on: [api]
  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      BACKEND: http://frontend:8081
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
    ports: ["8888:8080"]
    depends_on: [frontend]