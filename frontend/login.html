<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SecureDeploy Shop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Secure<span>Deploy</span> Shop</a>
    <nav id="nav"></nav>
  </header>
  <main class="auth">
    <div class="authcard">
      <h2>Welcome back</h2>
      <p class="note left">Sign in to your account</p>
      <form id="loginForm">
        <label for="u">Username</label>
        <input id="u" maxlength="100" autocomplete="username" required>
        <label for="p">Password</label>
        <input id="p" type="password" maxlength="200" autocomplete="current-password" required>
        <label class="check"><input id="show" type="checkbox"> Show password</label>
        <button type="submit">Sign in</button>
      </form>
      <p id="msg" class="formmsg"></p>
      <p class="note left">New here? <a class="lnk" href="/signup.html">Create an account</a></p>
      <p class="hint">Lab demo account: alice / password123</p>
    </div>
  </main>
  <script src="/nav.js"></script>
  <script src="/login.js"></script>
</body>
</html>
