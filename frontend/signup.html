<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - SecureDeploy Shop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Secure<span>Deploy</span> Shop</a>
    <nav id="nav"></nav>
  </header>
  <main class="auth">
    <div class="authcard">
      <h2>Create your account</h2>
      <p class="note left">Takes a few seconds</p>
      <form id="signupForm">
        <label for="u">Username</label>
        <input id="u" maxlength="30" autocomplete="username" required>
        <label for="p">Password (at least 6 characters)</label>
        <input id="p" type="password" maxlength="200" autocomplete="new-password" required>
        <label for="p2">Confirm password</label>
        <input id="p2" type="password" maxlength="200" autocomplete="new-password" required>
        <button type="submit">Sign up</button>
      </form>
      <p id="msg" class="formmsg"></p>
      <p class="note left">Already have an account? <a class="lnk" href="/login.html">Log in</a></p>
    </div>
  </main>
  <script src="/nav.js"></script>
  <script src="/signup.js"></script>
</body>
</html>
